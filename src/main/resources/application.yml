server:
  port: ${APP_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: naver-news
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  config:
    import: optional:file:.env[.properties]
  r2dbc:
    url: r2dbc:pool:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

app:
  duplicate:
    threshold: ${DUPLICATED_COUNT}

naver:
  openapi:
    url: ${NAVER_OPENAPI_URL}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
  search:
    display: ${NAVER_SEARCH_DISPLAY}
    start: ${NAVER_SEARCH_START}
    sort: ${NAVER_SEARCH_SORT}

slack:
  webhook:
    breaking: ${BREAKING_NEWS_WEBHOOK_URL}
    exclusive: ${EXCLUSIVE_NEWS_WEBHOOK_URL}
    develop: ${DEVELOP_WEBHOOK_URL}

logstash:
  host: ${LOGSTASH_HOST}
  tcp-port: ${LOGSTASH_TCP_PORT}

elk:
  active: ${ELK_ACTIVE}

llm:
  enabled: ${LLM_ENABLED:true}
  provider: ${LLM_PROVIDER:groq}
  temperature: ${LLM_TEMPERATURE:0.3}
  max-tokens: ${LLM_MAX_TOKENS:1000}
  summary-max-tokens: ${LLM_SUMMARY_MAX_TOKENS:1500}
  providers:
    groq:
      api-key: ${GROQ_API_KEY:}
      api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    openai:
      api-key: ${OPENAI_API_KEY:}
      api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
      model: ${OPENAI_MODEL:gpt-4o-mini}
